name: 自动同步上游仓库

on:
  schedule:
    # UTC 每2小时执行一次
    - cron: "0 */2 * * *"
  workflow_dispatch: # 允许你在 Actions 页面手动点击按钮随时强制触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 自动同步所有分支
        uses: repo-sync/github-sync@v2
        with:
          # 原作者的官方仓库地址
          source_repo: "https://github.com/hex-ci/Microsoft-Rewards-Script.git"
          # 填入你在 Settings 中配置的 Secret Token 变量
          target_repo: "https://${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git"
          # 同步上游的所有分支
          upstream_branch: "refs/heads/*"
          # 覆盖推送到你的所有对应分支
          target_branch: "refs/heads/*"
