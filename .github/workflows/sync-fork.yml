name: 自动同步上游仓库

on:
  schedule:
    # UTC 每2小时执行一次
    - cron: "0 */2 * * *"
  workflow_dispatch: # 允许手动点击按钮强制触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 配置 Git 并强制全量同步所有分支
        run: |
          # 1. 明确指定初始化默认分支为 sync，同时关掉提示，解决提示警告
          git config --global init.defaultBranch sync
          git config --global advice.defaultBranchName false
          
          # 2. 初始化空白本地仓库
          git init
          
          # 3. 配置 Git 身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 4. 添加上游原作者的仓库作为远程源
          git remote add upstream https://github.com/hex-ci/Microsoft-Rewards-Script.git
          
          # 5. 抓取上游的所有分支和提交历史
          git fetch upstream --prune
          
          # 6. 全量同步：只推送上游确实存在的全部分支
          # 因为原作者仓库里没有 sync 分支，所以这里绝对不会有任何东西写入你仓库的 sync 分支，
          # 你的脚本文件在此处是绝对安全的！
          git push "https://${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git" \
            "+refs/remotes/upstream/*:refs/heads/*" \
            --force \
            --tags
