name: 自动同步上游仓库


on:

  schedule:

    # UTC 每2小时同步一次

    - cron: "0 */2 * * *"


  workflow_dispatch:




permissions:

  contents: write




env:


  # 上游仓库

  UPSTREAM_REPO: hex-ci/Microsoft-Rewards-Script


  # 当前仓库

  TARGET_REPO: wolfing88/Microsoft-Rewards-Script



jobs:


  sync:


    runs-on: ubuntu-latest



    steps:



      # =================================
      # Checkout sync 分支
      # =================================

      - name: Checkout sync branch


        uses: actions/checkout@v4


        with:


          ref: sync


          fetch-depth: 0


          token: ${{ secrets.SYNC_TOKEN }}






      # =================================
      # Git 配置
      # =================================

      - name: Configure git


        run: |


          git config user.name "github-actions[bot]"


          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"







      # =================================
      # 添加 upstream
      # =================================

      - name: Fetch upstream


        run: |


          git remote remove upstream 2>/dev/null || true



          git remote add upstream \
          https://github.com/${UPSTREAM_REPO}.git




          git fetch upstream --prune



          git fetch upstream --tags --force








      # =================================
      # 同步所有分支
      # =================================

      - name: Sync all branches


        run: |


          echo "获取 upstream 分支"



          branches=$(git for-each-ref \
          --format='%(refname)' \
          refs/remotes/upstream/ \
          | grep -v 'refs/remotes/upstream/HEAD' \
          | sed 's#refs/remotes/upstream/##')



          echo "发现分支:"


          echo "$branches"





          for branch in $branches


          do



            echo ""


            echo "=================================="


            echo "同步分支: $branch"


            echo "=================================="




            # 创建临时分支指向 upstream


            git checkout -B "$branch" \
            "upstream/$branch"





            # 强制覆盖目标分支


            git push \
            https://${{ secrets.SYNC_TOKEN }}@github.com/${TARGET_REPO}.git \
            "$branch:$branch" \
            --force





            echo "✅ $branch 完成"



          done







      # =================================
      # 同步 tags
      # =================================

      - name: Sync tags


        run: |


          echo "同步 tags"



          git push \
          https://${{ secrets.SYNC_TOKEN }}@github.com/${TARGET_REPO}.git \
          "+refs/tags/*:refs/tags/*"



          echo "✅ tags 完成"







      # =================================
      # 返回 sync 分支
      # =================================

      - name: Restore sync branch


        run: |


          git checkout sync



          echo "sync workflow 分支保持不变"
