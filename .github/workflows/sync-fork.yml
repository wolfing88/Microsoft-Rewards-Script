name: 自动同步上游仓库


on:

  schedule:
    # UTC 每2小时执行一次
    - cron: "0 */2 * * *"

  workflow_dispatch:



permissions:

  contents: write



env:

  UPSTREAM_REPO: hex-ci/Microsoft-Rewards-Script

  TARGET_REPO: wolfing88/Microsoft-Rewards-Script



jobs:

  sync:


    runs-on: ubuntu-latest



    steps:


      # =====================================
      # Checkout 当前仓库
      # =====================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          token: ${{ secrets.SYNC_TOKEN }}



      # =====================================
      # Git 配置
      # =====================================

      - name: Configure git

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



      # =====================================
      # 备份自己的 sync-fork.yml
      # 记录它所在分支
      # =====================================

      - name: Backup self workflow

        run: |


          CURRENT_BRANCH=$(git branch --show-current)


          echo "$CURRENT_BRANCH" > /tmp/original_branch



          echo "当前 workflow 所在分支:"

          cat /tmp/original_branch



          mkdir -p /tmp/workflow_backup



          if [ -f ".github/workflows/sync-fork.yml" ];

          then

            cp \
            .github/workflows/sync-fork.yml \
            /tmp/workflow_backup/sync-fork.yml

            echo "workflow 已备份"

          else

            echo "没有找到 sync-fork.yml"

          fi





      # =====================================
      # 拉取 upstream
      # =====================================

      - name: Fetch upstream

        run: |


          git remote remove upstream 2>/dev/null || true



          git remote add upstream \
          https://github.com/${UPSTREAM_REPO}.git



          git fetch upstream --prune



          git fetch upstream --tags --force





      # =====================================
      # 同步所有分支
      # =====================================

      - name: Sync branches

        run: |


          branches=$(git for-each-ref \
          --format='%(refname)' \
          refs/remotes/upstream/ \
          | grep -v 'refs/remotes/upstream/HEAD' \
          | sed 's#refs/remotes/upstream/##')



          echo "发现分支:"

          echo "$branches"



          for branch in $branches

          do


            echo ""

            echo "===================================="

            echo "同步分支: $branch"

            echo "===================================="



            # 创建本地分支完全匹配 upstream

            git checkout -B "$branch" \
            "upstream/$branch"



            # 强制推送

            git push \
            https://${{ secrets.SYNC_TOKEN }}@github.com/${TARGET_REPO}.git \
            "$branch:$branch" \
            --force



            echo "✅ $branch 同步完成"


          done





      # =====================================
      # 同步 tags
      # =====================================

      - name: Sync tags

        run: |


          echo "开始同步 tags"



          git push \
          https://${{ secrets.SYNC_TOKEN }}@github.com/${TARGET_REPO}.git \
          "+refs/tags/*:refs/tags/*"



          echo "✅ tags 同步完成"





      # =====================================
      # 恢复自己的 workflow
      # 回原本分支
      # =====================================

      - name: Restore self workflow

        run: |


          ORIGINAL_BRANCH=$(cat /tmp/original_branch)


          echo "恢复 workflow 到分支:"

          echo "$ORIGINAL_BRANCH"



          git checkout "$ORIGINAL_BRANCH"



          if [ -f "/tmp/workflow_backup/sync-fork.yml" ];

          then


            mkdir -p .github/workflows



            cp \
            /tmp/workflow_backup/sync-fork.yml \
            .github/workflows/sync-fork.yml



            git add .github/workflows/sync-fork.yml



            git commit \
            -m "Update sync-fork workflow" \
            || true



            git push \
            https://${{ secrets.SYNC_TOKEN }}@github.com/${TARGET_REPO}.git \
            "$ORIGINAL_BRANCH:$ORIGINAL_BRANCH"



            echo "✅ sync-fork.yml 恢复完成"


          else


            echo "没有需要恢复的 workflow"


          fi
